name: Library CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canvas-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-code:
    name: Generated protocol bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.20.0
          runtime: node@22
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Install protoc 35.1
        shell: bash
        run: |
          curl -fsSL \
            https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip \
            -o "$RUNNER_TEMP/protoc.zip"
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - name: Regenerate and compare bindings
        run: bash scripts/verify-generated.sh

  verify:
    name: Cross-platform verification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.20.0
          runtime: node@22
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Build reusable packages
        run: pnpm -r --filter "./packages/*" build
      - name: Packed external-consumer and release contracts
        run: >-
          pnpm vitest run
          test/package-artifacts.test.ts
          test/release-contract.test.ts
          test/library-boundaries.test.ts
      - name: TypeScript behavior, runtime, integration, and example tests
        run: >-
          pnpm vitest run
          --exclude test/package-artifacts.test.ts
          --exclude test/release-contract.test.ts
          --exclude test/library-boundaries.test.ts
          --exclude packages/client/test/load-budget.test.ts
      - name: Isolated scene and network load budget
        run: pnpm vitest run packages/client/test/load-budget.test.ts
      - name: Go rooms SDK and service tests
        run: go -C server test ./...
      - name: Go race detection
        if: runner.os == 'Linux'
        run: go -C server test ./... -race
