server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The Rapier build is WebAssembly, so it needs the right content type.
    types {
        application/wasm wasm;
    }
    include /etc/nginx/mime.types;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
